name: Build Motion Blur

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android ARM64 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Configure
        run: xmake f -y -p android -a arm64-v8a -m release --ndk="${{ steps.ndk.outputs.ndk-path }}"

      - name: Build native library
        run: xmake -y

      - name: Package LeviLauncher mod
        shell: bash
        run: |
          LIBRARY="$(find build -type f -name 'libMotionBlur.so' -print -quit)"
          test -n "$LIBRARY"
          python scripts/package_levipack.py --library "$LIBRARY" --output dist/motionblur.levipack

      - name: Verify package
        run: python scripts/verify_levipack.py dist/motionblur.levipack

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotionBlur-Android-arm64
          path: |
            dist/motionblur.levipack
            dist/libMotionBlur.so
          if-no-files-found: error
          retention-days: 14
